[project]
name = "resulex"
version = "0.1.1"
description = "Resume text parser built on rules, reference data and a small spaCy model (no LLM)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Mishra" }]
requires-python = ">=3.12"
keywords = ["resume", "parser", "nlp", "spacy", "information-extraction", "onet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
# The spaCy model is not on PyPI; users install it with: python -m spacy download en_core_web_sm
dependencies = [
    "spacy>=3.8,<3.9",
]

[project.scripts]
resulex = "resulex.cli:main"

[dependency-groups]
dev = [
    "en_core_web_sm",
    "openpyxl>=3.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
# Format with: uvx ruff format .
line-length = 120
