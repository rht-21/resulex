format = "json"
path = "keywords.json"
records = "EmploymentType.{label}"
entity = "employment_type"
label = "label"
aliases = ["_value[*]"]

[[source]]
name = "esco_skills"
format = "csv"
path = "tabiya/skills.csv"
entity = "skill"
id = "ID"
label = "PREFERREDLABEL"
aliases = ["ALTLABELS"]
alias_sep = "\n"

# ---- relations: extra entity <-> occupation links (used to boost coherent matches) ----

[[relation]]
name = "esco_occupation_skills"
format = "csv"
path = "tabiya/occupation_skill_relations.csv"
entity = "skill"
id = "SKILLID"
soc = "OCCUPATIONID"
soc_via = ["esco_code", "esco_soc"]
weight = "RELATIONTYPE"
weights = { essential = 1.0, optional = 0.6 }

[[relation]]
name = "cos_cert_occupations"
format = "sql"
path = "certifications/6-CERT_ONET_ASSIGN.sql"
table = "CERT_ONET_ASSIGN"
entity = "cert"
id = "CERT_ID"
soc = "ONETCODE"
weight = "RELATION"
weights = { D = 1.0, I = 0.5 }
