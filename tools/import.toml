path = "keywords.json"
records = "Occupation.{parent}.Occupation.{soc}.License.{label}"
entity = "license"
label = "label"
aliases = ["_value[*]"]
soc = "soc"

[[source]]
name = "kw_spec_licenses"
format = "json"
path = "keywords.json"
records = "Occupation.{soc}.Specialization.{code}.License.{label}"
entity = "license"
label = "label"
aliases = ["_value[*]"]
soc = "soc"

[[source]]
name = "kw_certifications"
format = "json"
path = "keywords.json"
records = "Occupation.{soc}.Certification.{label}"
entity = "cert"
label = "label"
aliases = ["_value[*]"]
soc = "soc"

[[source]]
name = "kw_sub_certifications"
format = "json"
path = "keywords.json"
records = "Occupation.{parent}.Occupation.{soc}.Certification.{label}"
entity = "cert"
label = "label"
aliases = ["_value[*]"]
soc = "soc"

[[source]]
name = "kw_spec_certifications"
format = "json"
path = "keywords.json"
records = "Occupation.{soc}.Specialization.{code}.Certification.{label}"
entity = "cert"
label = "label"
aliases = ["_value[*]"]
soc = "soc"

[[source]]
name = "kw_skills"
format = "json"
path = "keywords.json"
records = "Occupation.{soc}.Skill.{label}"
entity = "skill"
label = "label"
aliases = ["_value[*]"]
soc = "soc"

[[source]]
name = "kw_sub_skills"
format = "json"
path = "keywords.json"
records = "Occupation.{parent}.Occupation.{soc}.Skill.{label}"
entity = "skill"
label = "label"
aliases = ["_value[*]"]
soc = "soc"

[[source]]
name = "kw_spec_skills"
format = "json"
path = "keywords.json"
records = "Occupation.{soc}.Specialization.{code}.Skill.{label}"
entity = "skill"
label = "label"
aliases = ["_value[*]"]
soc = "soc"

[[source]]
name = "kw_languages"
format = "json"
path = "keywords.json"
records = "Language.{label}"
entity = "language"
label = "label"
aliases = ["_value[*]"]

[[source]]
name = "kw_seniority"
format = "json"
path = "keywords.json"
records = "Seniority.{label}"
entity = "seniority"
label = "label"
aliases = ["_value[*]"]

[[source]]
name = "kw_work_mode"
